services:
  db:
    image: postgres:16
    container_name: fidk-db
    environment:
      POSTGRES_USER: fidk
      POSTGRES_PASSWORD: fidk
      POSTGRES_DB: fidk
      # Tuning inicial para carga em lote. Ajustar conforme hardware real.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    ports:
      # 55432 no host evita conflito com um PostgreSQL nativo (5432) e outros serviços.
      - "55432:5432"
    volumes:
      - fidk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidk -d fidk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fidk_pgdata:
